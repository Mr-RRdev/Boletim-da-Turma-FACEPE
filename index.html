<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boletim da Turma</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="img/tabela-icon.png" />
  </head>
  <body class="container">
    <header>
      <h1>Boletim da Turma - Curso da FACEPE</h1>
    </header>
    <main>
      <section id="secao-cadastro">
        <h2>Cadastro de Alunos</h2>
        <form id="form-aluno">
          <div>
            <label for="nome">Adicionar Aluno:</label>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Nome do Aluno"
            />
          </div>
          <div>
            <label for="nota1">Nota 1:</label>
            <input
              type="number"
              id="nota1"
              name="nota1"
              min="0"
              max="10"
              step="0.1"
              placeholder="Nota"
            />
          </div>
          <div>
            <label for="nota2">Nota 2:</label>
            <input
              type="number"
              id="nota2"
              name="nota2"
              min="0"
              max="10"
              step="0.1"
              placeholder="Nota"
            />
          </div>
          <div>
            <label for="nota3">Nota 3:</label>
            <input
              type="number"
              id="nota3"
              name="nota3"
              min="0"
              max="10"
              step="0.1"
              placeholder="Nota"
            />
          </div>

          <button type="button" id="btn-cadastrar">Cadastrar</button>

          <div id="mensagem-erro"></div>
        </form>
      </section>
      <section id="secao-resultados">
        <h2>Resultados da Turma</h2>
        <div id="controles-busca">
          <label for="busca">Buscar Aluno:</label>
          <input type="text" id="busca" placeholder="Digite um nome..." />
        </div>
        <div class="resumo-turma">
          <p id="media-turma" class="indicador-turma"></p>
          <p id="menor-media" class="indicador-turma"></p>
          <p id="maior-media" class="indicador-turma"></p>
        </div>
        <div class="table-wrapper">
          <table id="tabela-alunos">
            <thead>
              <tr>
                <th><button type="button" id="ordem-nome">Nome ↕</button></th>
                <th><button type="button" id="ordem-media">Média ↕</button></th>
                <th>
                  <button type="button" id="ordem-situacao">Situação ↕</button>
                </th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="corpo-tabela"></tbody>
          </table>
        </div>
        <button type="button" id="btn-limpar-tudo">Limpar tudo</button>
      </section>
    </main>
    <footer>
      <div class="creditos">
        <p>&copy; 2026 Renato Oliveira — 3º B</p>
      </div>
      <div class="github-container">
        <img
          class="dev-cat"
          src="img/dev-cat2.avif"
          alt="Logotipo do projeto"
        />
        <a
          class="link-github"
          href="https://github.com/Mr-RRdev"
          target="_blank"
          >Acesse o meu GitHub</a
        >
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
